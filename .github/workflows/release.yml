name: Release

# Builds static x86_64 + aarch64 Linux (musl), macOS (aarch64, x86_64) and
# Windows (x86_64) binaries and attaches them to the GitHub release for the
# pushed tag (`v*`). Re-running a tag re-uploads with --clobber.
# with --clobber.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to (re)build
        required: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target: [x86_64-unknown-linux-musl, aarch64-unknown-linux-musl]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - uses: dtolnay/rust-toolchain@stable

      - uses: taiki-e/install-action@v2
        with:
          tool: cross

      - name: Test
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: cargo test

      - name: Build
        run: |
          cross build --release --target ${{ matrix.target }}
          arch="${{ matrix.target }}"; arch="${arch%%-*}"
          cp "target/${{ matrix.target }}/release/mcpx" "mcpx-linux-${arch}"
          sha256sum "mcpx-linux-${arch}" > "mcpx-linux-${arch}.sha256"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: mcpx-linux-*

  build-native:
    strategy:
      matrix:
        include:
          - { os: macos-latest, target: aarch64-apple-darwin, asset: mcpx-macos-aarch64 }
          - { os: macos-latest, target: x86_64-apple-darwin, asset: mcpx-macos-x86_64 }
          - { os: windows-latest, target: x86_64-pc-windows-msvc, asset: mcpx-windows-x86_64.exe }
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Test
        if: matrix.target != 'x86_64-apple-darwin'
        run: cargo test --target ${{ matrix.target }}

      - name: Build
        run: |
          cargo build --release --target ${{ matrix.target }}
          bin=mcpx; [ "${{ runner.os }}" = Windows ] && bin=mcpx.exe
          cp "target/${{ matrix.target }}/release/$bin" "${{ matrix.asset }}"
          # `<hash>  <name>`, the format sha256sum writes on Linux (Git Bash's
          # sha256sum may mark binary mode with `*`, so write it explicitly).
          if command -v sha256sum >/dev/null; then
            hash=$(sha256sum "${{ matrix.asset }}" | cut -d' ' -f1)
          else
            hash=$(shasum -a 256 "${{ matrix.asset }}" | cut -d' ' -f1)
          fi
          hash="${hash#\\}"
          printf '%s  %s\n' "$hash" "${{ matrix.asset }}" > "${{ matrix.asset }}.sha256"
          cat "${{ matrix.asset }}.sha256"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: mcpx-*

  publish:
  publish:
    needs: [build, build-native]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          ls -la dist
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
            gh release edit "$TAG" --draft=false --latest
          else
              --notes "mcpx $TAG — binaries for Linux (static, x86_64/aarch64), macOS (aarch64/x86_64) and Windows (x86_64). See README for install." --latest
              --notes "mcpx $TAG — static Linux binaries (x86_64, aarch64). See README for install." --latest
          fi
