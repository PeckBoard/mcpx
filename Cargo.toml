[package]
name = "mcpx"
version = "0.2.1"
edition = "2024"
description = "MCP client CLI and local gateway: call any MCP server's tools from the shell or over one HTTP endpoint."
license = "MIT"
publish = false

# Standalone project: keep the parent peckboard checkout from treating this
# as a member of (or an error against) its own workspace.
[workspace]

[dependencies]
anyhow = "1"
axum = "0.8"
base64 = "0.22"
clap = { version = "4", features = ["derive", "env"] }
futures = "0.3"
globset = "0.4"
http = "1"
rand = "0.9"
# ring (not aws-lc-rs): pure Rust + a little C/asm that cross-compiles to musl
# without cmake/clang. The provider is installed at startup.
reqwest = { version = "0.13", default-features = false, features = ["json", "form", "query", "stream", "http2", "rustls-no-provider"] }
rmcp = { version = "3.7", features = [
    "client",
    "server",
    "transport-child-process",
    "transport-io",
    "transport-streamable-http-client-reqwest",
    "transport-streamable-http-server",
    "reqwest-tls-no-provider",
] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
sse-stream = "0.2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "io-std", "time", "sync", "signal", "fs", "process"] }
tokio-util = "0.7"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url = "2"

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = true
codegen-units = 1
strip = true
